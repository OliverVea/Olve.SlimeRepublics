<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" width="900" height="486" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <style>
    .bg    { fill: #ffffff; }
    .outer { fill: #f6f8fa; stroke: #afb8c1; }
    .inner { fill: #ffffff; stroke: #afb8c1; }
    .dur   { fill: #eef6ff; stroke: #54aeff; }
    .strip { fill: #eaeef2; stroke: #afb8c1; }
    .t     { fill: #1f2328; }
    .dim   { fill: #59636e; }
    .ln    { stroke: #59636e; }
    @media (prefers-color-scheme: dark) {
      .bg    { fill: #0d1117; }
      .outer { fill: #161b22; stroke: #3d444d; }
      .inner { fill: #0d1117; stroke: #3d444d; }
      .dur   { fill: #121d2f; stroke: #316dca; }
      .strip { fill: #21262d; stroke: #3d444d; }
      .t     { fill: #e6edf3; }
      .dim   { fill: #9198a1; }
      .ln    { stroke: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="dim"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="486"/>

  <!-- browser -->
  <rect class="outer" x="40" y="18" width="820" height="94" rx="8"/>
  <text class="dim" x="58" y="40" font-size="13" font-weight="600">Browser</text>
  <rect class="inner" x="70" y="50" width="370" height="46" rx="6"/>
  <text class="t" x="86" y="70" font-size="13" font-weight="600">SPA shell</text>
  <text class="dim" x="86" y="87" font-size="12">vanilla Web Components</text>
  <rect class="inner" x="460" y="50" width="380" height="46" rx="6"/>
  <text class="t" x="476" y="70" font-size="13" font-weight="600">Game client</text>
  <text class="dim" x="476" y="87" font-size="12">three.js · separate Vite entry point</text>

  <!-- surfaces -->
  <line class="ln" x1="300" y1="112" x2="300" y2="186" marker-end="url(#a)"/>
  <text class="t"   x="310" y="140" font-size="12" font-weight="600">GET /</text>
  <text class="dim" x="310" y="156" font-size="11">static · anonymous</text>
  <line class="ln" x1="600" y1="112" x2="600" y2="186" marker-end="url(#a)"/>
  <text class="t"   x="610" y="140" font-size="12" font-weight="600">/api/*</text>
  <text class="dim" x="610" y="156" font-size="11">JSON · JWT bearer</text>

  <!-- server -->
  <rect class="outer" x="40" y="188" width="820" height="212" rx="8"/>
  <text class="dim" x="58" y="211" font-size="13" font-weight="600">Game server — one process, one pod, one world</text>
  <rect class="strip" x="62" y="222" width="776" height="30" rx="5"/>
  <text class="dim" x="78" y="242" font-size="12">Kestrel · single listener</text>

  <rect class="inner" x="62" y="270" width="376" height="98" rx="6"/>
  <text class="t"   x="78" y="294" font-size="13" font-weight="600">HTTP surface</text>
  <text class="dim" x="78" y="314" font-size="12">auth · OpenAPI · CRUD</text>
  <text class="dim" x="78" y="331" font-size="12">serves the SPA bundle + JSON API</text>
  <text class="dim" x="78" y="354" font-size="12" font-style="italic">live-world transport — TBD (redesign)</text>

  <rect class="dur" x="462" y="270" width="376" height="98" rx="6"/>
  <text class="t"   x="478" y="294" font-size="13" font-weight="600">EntityStore&lt;T&gt; — durable state</text>
  <text class="dim" x="478" y="314" font-size="12">whole-snapshot persister</text>
  <text class="dim" x="478" y="331" font-size="12">debounced save · flushed on shutdown</text>
  <text class="dim" x="478" y="354" font-size="12" font-style="italic">survives restarts</text>

  <line class="ln" x1="650" y1="400" x2="650" y2="430" marker-end="url(#a)"/>
  <rect class="inner" x="556" y="432" width="188" height="34" rx="6"/>
  <text class="dim" x="572" y="454" font-size="12">snapshot file / volume</text>
</svg>
