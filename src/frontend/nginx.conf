# Replaces the image's default.conf. TLS ends at Cloudflare (prod) or Traefik (beta); this
# only ever sees plain HTTP from Traefik.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /ws {
        # Refuse sockets opened by pages on other sites (cross-site WebSocket hijacking). The
        # browser always sends Origin on a WebSocket handshake; the page is served over https.
        if ($http_origin != "https://$host") {
            return 403;
        }

        # The Service the chart names {{ .Release.Name }}-server, resolved in this namespace.
        proxy_pass http://olve-slimerepublics-server:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # nginx's 60s default would cut a quiet socket; the server's own idle timeout governs.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Vite fingerprints everything under assets/, so it can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
