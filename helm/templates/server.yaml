apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app: {{ .Release.Name }}-server
spec:
  # Must stay 1. One game server owns one game world, held in process memory, so a second
  # replica would be a second, divergent world with the Service round-robining players
  # between them.
  replicas: 1
  strategy:
    # Recreate, not RollingUpdate: a rolling update briefly runs two pods — two worlds —
    # behind one Service. Recreate makes the handover a clean disconnect clients reconnect
    # through. The world is lost on every deploy until persistence exists.
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-server
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-server
    spec:
      {{- include "slimes.podSecurity" . | nindent 6 }}
      # The server does not handle SIGTERM yet, and as PID 1 an unhandled SIGTERM is ignored,
      # so Kubernetes would wait out the full default 30s before SIGKILL on every deploy.
      terminationGracePeriodSeconds: 5
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- include "slimes.containerSecurity" . | nindent 10 }}
          ports:
            - name: ws
              containerPort: {{ .Values.server.port }}
          # No HTTP route on the server, so the probes only check the port is accepting.
          readinessProbe:
            tcpSocket:
              port: ws
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-server
  labels:
    app: {{ .Release.Name }}-server
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}-server
  ports:
    - name: ws
      port: {{ .Values.server.port }}
      targetPort: ws
